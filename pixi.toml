[workspace]
authors = ["ZenosZeng"]
channels = ["conda-forge"]
name = "moments"
platforms = ["win-64"]
version = "0.1.0"

[workspace.conda-pypi-map]
conda-forge = { mapping-mode = "replace" }

[tasks]
app = "python scripts/project_tasks.py app"
test = "python scripts/project_tasks.py test"
release = "python scripts/project_tasks.py release"

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = ">=3.12,<3.13"
matplotlib = ">=3.11.0,<4"
pillow = ">=12.3.0,<13"
pillow-heif = ">=1.4.0,<2"
pytest = ">=9.1.1,<10"
flask = ">=3.1.3,<4"
nodejs = ">=26.5.0,<26.6"

[pypi-dependencies]
geonamescache = ">=3.0.1, <4"
